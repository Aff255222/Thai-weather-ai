<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THAI WEATHER AI — ระบบวิเคราะห์และพยากรณ์อากาศอัจฉริยะประเทศไทย</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap">
<style>
:root{--ink:#f5f8ff;--mut:#b9c7e6;--acc:#8cc0ff;--line:rgba(255,255,255,.16);--glass:rgba(255,255,255,.11);--warn:#ffc46b;--bad:#ffa3a3;--bg:#0b1630;--l1:13%;--l2:30%;--h:218;--s:50%;--card:hsl(var(--h) var(--s) calc(var(--l1) + 5%));color-scheme:dark}
@media(prefers-color-scheme:light){:root{--ink:#0e1c3d;--mut:#4a5b82;--acc:#1b5fd1;--line:rgba(14,28,61,.14);--glass:rgba(255,255,255,.62);--warn:#8a5200;--bad:#b02020;--bg:#eef3fb;--l1:88%;--l2:96%;color-scheme:light}}
html[data-sky=day]{--h:210;--s:72%}html[data-sky=night]{--h:230;--s:48%}html[data-sky=cloud]{--h:214;--s:20%}html[data-sky=rain]{--h:218;--s:26%}html[data-sky=storm]{--h:262;--s:26%}html[data-sky=fog]{--h:200;--s:10%}
*{box-sizing:border-box}html{scroll-padding-top:120px}
body{margin:0;background-color:hsl(var(--h) var(--s) var(--l2));background-image:linear-gradient(hsl(var(--h) var(--s) var(--l1)),hsl(var(--h) var(--s) var(--l2)));background-attachment:fixed;min-height:100vh;color:var(--ink);font:400 16px/1.55 'Sarabun',system-ui,'Noto Sans Thai',sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border-bottom:1px solid var(--line);padding:10px 16px}
.bar{max-width:1080px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{font-weight:700;font-size:18px;letter-spacing:.02em}.logo span{color:var(--acc)}
.sw{position:relative;flex:1;min-width:200px}
input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
button{font:inherit;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px}
button.p{background:var(--acc);border-color:var(--acc);color:var(--bg)}
#res{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;max-height:50vh;overflow:auto}
#res li{padding:10px 12px;border-radius:10px;cursor:pointer}#res li.na,#res li[role=presentation]{cursor:default}#res li[aria-selected=true],#res li[role=option]:hover{background:var(--glass)}#res b{font-weight:600}#res small{display:block;color:var(--mut);font-size:13px}#res button{width:100%}
nav{max-width:1080px;margin:8px auto 0;display:flex;gap:6px;flex-wrap:wrap}
nav a{color:var(--mut);text-decoration:none;padding:6px 12px;border-radius:99px;border:1px solid var(--line)}
#menu{display:none}
@media(max-width:720px){#menu{display:inline-flex}nav{display:none;flex-direction:column}nav.open{display:flex}}
main{max-width:1080px;margin:auto;padding:16px}
section{background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line);border-radius:26px;padding:18px;margin:0 0 14px}
h2{margin:0 0 4px;font-size:20px}.mut{color:var(--mut);font-size:14px}.na{color:var(--mut);font-style:italic}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}.hero>div{display:flex;flex-direction:column;align-items:center}.city{font-size:26px}.big{font-size:104px;font-weight:200;line-height:1;letter-spacing:-.04em}.cond{font-size:20px}.ico{width:72px;height:72px;filter:drop-shadow(0 2px 4px rgba(0,20,60,.3))}#h-now{position:absolute;left:-9999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.c{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:14px}.c b{display:block;font-size:24px;font-weight:600}.c small{font-weight:400;color:var(--mut)}
.c .l{color:var(--mut);font-size:14px;cursor:help;text-decoration:underline dotted}
svg{width:100%;height:auto;display:block}.gl{stroke:var(--line)}.ax{fill:var(--mut);font-size:10px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut)}.lg i{display:inline-block;width:12px;height:3px;margin-right:5px;vertical-align:middle}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
